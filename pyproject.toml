[project]
name = "brave-dev-loop"
version = "0.1.0"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "."]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501: long lines are tolerated.
# E402: scripts deliberately sys.path.insert() the bot's scripts/ dir before
#       importing the local lib package, so those imports cannot be at the top.
ignore = ["E501", "E402"]
